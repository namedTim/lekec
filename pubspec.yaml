name: lekec
description: pill dispenser
version: 1.5.5+17

publish_to: "none"

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^17.0.0
  material_symbols_icons: ^4.2892.0
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  workmanager: ^0.9.0
  # Vendored fork of the `alarm` package (see packages/alarm). Forked to add
  # custom notification action buttons (e.g. "Sem vzel" / "Bom preskočil") to
  # the full-screen alarm notification on Android.
  alarm:
    path: packages/alarm
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  intl: any
  camera: ^0.11.0+2
  http: ^1.2.2
  google_mlkit_text_recognition: ^0.15.1
  image: ^4.0.0
  flutter_native_splash: ^2.4.7
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0
  package_info_plus: ^8.0.0
  # Backs the cross-isolate queue for medication notification action taps
  # ("Sem vzel" / "Bom preskočil") on non-critical reminders — see
  # lib/data/services/pending_action_queue.dart.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/alarms/
